<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Console - WMS Indraco</title>
    <meta name="description" content="Masuk ke WMS Indraco Console Manager.">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkblue: {
                            950: '#070a13',
                            900: '#0b0f19',
                            800: '#0f172a',
                            700: '#1e293b',
                            600: '#334155',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css?v=3.9">
</head>
<body class="bg-darkblue-950 text-slate-100 min-h-screen flex items-center justify-center p-4" data-page="login">

    <!-- Notification Toast Container -->
    <div id="toast-container" class="notification-container"></div>

    <div class="w-full max-w-md glass-panel p-6 sm:p-8 space-y-6 shadow-2xl">
        <!-- Brand / Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex h-12 w-12 rounded-xl bg-sky-500 items-center justify-center shadow-lg shadow-sky-500/20 mb-2">
                <i class="bi bi-boxes text-2xl text-darkblue-900"></i>
            </div>
            <h1 class="text-lg font-bold text-white tracking-tight">WMS Indraco Console</h1>
            <p class="text-xxs text-slate-400">Silakan masukkan akun Anda untuk masuk ke sistem.</p>
        </div>

        <!-- Form -->
        <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
            <div>
                <label for="login-username" class="form-label text-slate-300">Username</label>
                <input type="text" id="login-username" class="form-control custom-input py-2.5 px-3" placeholder="Masukkan username Anda..." required>
            </div>
            <div>
                <label for="login-password" class="form-label text-slate-300">Password</label>
                <input type="password" id="login-password" class="form-control custom-input py-2.5 px-3" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary bg-sky-500 hover:bg-sky-600 border-none text-darkblue-950 font-bold text-xs w-full py-2.5 rounded-lg flex items-center justify-center gap-1.5 shadow-lg shadow-sky-500/10">
                <i class="bi bi-box-arrow-in-right"></i> Masuk Ke Console
            </button>
        </form>

        <div class="border-t border-slate-800 my-4"></div>

        <!-- Simulated Quick Logins -->
        <div class="space-y-3">
            <span class="text-xxs text-slate-400 font-bold uppercase tracking-wider block text-center">Akses Instan Demo Simulator</span>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="quickLogin('admin')" class="btn btn-xs py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xxs font-bold rounded flex flex-col items-center gap-1">
                    <i class="bi bi-shield-lock-fill text-xs"></i> Admin
                </button>
                <button onclick="quickLogin('supervisor')" class="btn btn-xs py-2 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xxs font-bold rounded flex flex-col items-center gap-1">
                    <i class="bi bi-people-fill text-xs"></i> Supervisor
                </button>
                <button onclick="quickLogin('operator')" class="btn btn-xs py-2 bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 text-xxs font-bold rounded flex flex-col items-center gap-1">
                    <i class="bi bi-box-seam-fill text-xs"></i> Operator
                </button>
            </div>
        </div>
    </div>

    <!-- Script Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core JS -->
    <script src="app.js?v=3.9"></script>
</body>
</html>
